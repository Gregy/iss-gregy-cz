name: Push relay (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  pull_request:
    paths: ['worker/**']
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # crypto unit tests + full relay test against a local D1 and a mock push service
      - run: npm test

      # Deploy only from main and only once Cloudflare credentials are configured.
      - name: Apply D1 migrations
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply iss-push --remote
      - name: Deploy worker
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
