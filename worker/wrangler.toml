name = "iss-push"
main = "src/index.js"
compatibility_date = "2025-09-15"

# The relay's public address; Cloudflare creates the DNS record and certificate.
routes = [{ pattern = "push.iss.gregy.cz", custom_domain = true }]
workers_dev = false

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "iss-push"
database_id = "310359ee-92fb-4465-a743-18b4cc75a1fb"
migrations_dir = "migrations"

# Per-IP limit on the write endpoints. Optional: remove this block if your
# account doesn't offer the rate limiting binding; the worker then skips the check.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[vars]
# Browser origins allowed to call the API (your GitHub Pages origin; localhost for development).
ALLOWED_ORIGINS = "https://iss.gregy.cz,http://localhost:8765,http://127.0.0.1:8765"
MAX_SUBSCRIPTIONS = "1000"
SEND_BATCH = "40" # pushes per cron run; the free plan allows 50 subrequests per invocation
